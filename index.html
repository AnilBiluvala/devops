<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DevOps Skills Activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#11151c; --panel:#171c25; --panel2:#1d2430; --line:#2a3242;
  --text:#e7ebf3; --muted:#8b97ab; --accent:#5eead4; --accent2:#7dd3fc;
  --amber:#fbbf24; --red:#f87171; --green:#34d399;
  --sans:"Space Grotesk",system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--text);
  font-family:var(--sans); line-height:1.5;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
}
#app{max-width:640px;margin:0 auto;padding:28px 18px 60px}
.win{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 20px 50px -25px rgba(0,0,0,.6)}
.win-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%}
.dot.r{background:#f87171}.dot.y{background:#fbbf24}.dot.g{background:#34d399}
.win-title{margin-left:8px;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.win-body{padding:26px 22px}

h1{font-size:1.5rem;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.92rem;margin:0 0 22px;max-width:52ch}
.prompt{font-family:var(--mono);color:var(--accent);font-size:.9rem;margin-bottom:18px}
.prompt::after{content:"▌";animation:blink 1.1s steps(1) infinite;color:var(--accent2)}
@media (prefers-reduced-motion:reduce){.prompt::after{animation:none}}

.steps{display:flex;gap:6px;margin-bottom:22px;font-family:var(--mono);font-size:.74rem}
.step{flex:1;text-align:center;padding:7px 4px;border-radius:6px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.step.on{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:600}
.step.done{color:var(--accent);border-color:var(--accent)}

label{display:block;font-size:.82rem;color:var(--muted);margin:0 0 6px}
input[type=text]{
  width:100%;padding:12px 13px;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;color:var(--text);font-family:var(--mono);font-size:.95rem;margin-bottom:16px;
}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.err{color:var(--red);font-size:.82rem;min-height:1.2em;margin:-10px 0 12px}

.btn{
  font-family:var(--sans);font-weight:600;font-size:.95rem;border:none;border-radius:8px;
  padding:12px 20px;cursor:pointer;transition:transform .12s ease;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#08201c}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn-block{width:100%}
.row{display:flex;gap:10px}

.timer-wrap{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding:12px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:8px}
.timer-label{font-size:.8rem;color:var(--muted)}
.timer{font-family:var(--mono);font-size:1.5rem;font-weight:700;color:var(--accent)}
.timer.warn{color:var(--amber)}
.timer.crit{color:var(--red)}

#stageList{list-style:none;margin:0 0 20px;padding:0;display:flex;flex-direction:column;gap:8px}
#stageList li{
  display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:11px 12px;font-family:var(--mono);font-size:.88rem;
}
.pos{color:var(--accent);font-weight:700;min-width:1.4em}
.stagename{flex:1}
.ud{display:flex;gap:4px}
.ud button{
  width:30px;height:30px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);
  color:var(--text);cursor:pointer;font-size:.9rem;
}
.ud button:disabled{opacity:.3;cursor:not-allowed}

.qcard{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px 15px;margin-bottom:12px}
.qtext{font-size:.92rem;margin:0 0 10px;font-weight:600}
.qtext .n{color:var(--accent);font-family:var(--mono);margin-right:6px}
.opt{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:6px;font-family:var(--mono);font-size:.86rem;cursor:pointer}
.opt:hover{background:var(--panel2)}
.opt input{accent-color:var(--accent)}
.note{font-size:.78rem;color:var(--muted);margin:2px 0 16px}

.scoreboard{display:flex;gap:12px;margin:6px 0 22px}
.scorebox{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:16px;text-align:center}
.scorebox .big{font-family:var(--mono);font-size:1.8rem;font-weight:700;color:var(--accent)}
.scorebox .lab{font-size:.76rem;color:var(--muted);margin-top:4px}
.total{border-color:var(--accent);background:rgba(94,234,212,.06)}
.total .big{color:var(--accent2)}
.meta{font-size:.86rem;color:var(--muted);margin-bottom:4px}
.meta b{color:var(--text)}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:var(--panel2);border:1px solid var(--accent);color:var(--text);
  padding:10px 16px;border-radius:8px;font-size:.85rem;font-family:var(--mono);
  box-shadow:0 10px 30px -10px rgba(0,0,0,.6);z-index:20;
}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const SDLC_CORRECT = ['req','design','impl','test','deploy','maint'];
const SDLC_LABELS = {req:'Requirement Analysis',design:'Design',impl:'Implementation (Coding)',test:'Testing',deploy:'Deployment',maint:'Maintenance'};

const GIT_Q = [
 {q:'Which command initializes a new Git repository?',o:['git init','git start','git new','git create'],c:0},
 {q:'Which command creates a local copy of a remote repository?',o:['git copy','git clone','git fork','git pull'],c:1},
 {q:'Which command stages changes for the next commit?',o:['git commit','git add','git stage-only','git push'],c:1},
 {q:'Which command shows the commit history?',o:['git history','git log','git show','git status'],c:1},
 {q:'Which command creates a new branch?',o:['git branch <name>','git new-branch <name>','git create-branch <name>','git checkout-branch <name>'],c:0},
 {q:'Which command switches the working directory to another branch?',o:['git switch-to','git checkout','git move','git go'],c:1},
 {q:'Which command merges another branch into the current branch?',o:['git combine','git merge','git join','git union'],c:1},
 {q:'Which command uploads local commits to a remote repository?',o:['git upload','git push','git send','git commit -r'],c:1},
 {q:'Which command downloads changes from a remote without merging them?',o:['git fetch','git pull','git clone','git sync'],c:0},
 {q:'Which command shows the current status of the working directory?',o:['git state','git status','git info','git check'],c:1},
];

let S = { screen:'login', name:'', usn:'', order:[], score1:null, ans:{}, score2:null, subDate:null };
let t1Remain=60, t1Timer=null, t2Remain=300, t2Timer=null;

function shuffledStages(){
  let a=[...SDLC_CORRECT];
  do{ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} }
  while(a.every((v,i)=>v===SDLC_CORRECT[i]));
  return a;
}
function fmtDate(d){
  return d.toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function steps(active){
  const labels=['Details','Activity 1','Activity 2','Result'];
  const order=['login','act1','act2','result'];
  const ai=order.indexOf(active);
  return `<div class="steps">${labels.map((l,i)=>
    `<div class="step ${i===ai?'on':i<ai?'done':''}">${i+1}. ${l}</div>`).join('')}</div>`;
}
function winShell(title, inner){
  return `<div class="win"><div class="win-bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
  <span class="win-title">${title}</span></div><div class="win-body">${inner}</div></div>`;
}

function renderLogin(){
  document.getElementById('app').innerHTML = winShell('devops-activity — student-entry', `
    ${steps('login')}
    <p class="prompt">$ ./start-activity --subject devops</p>
    <h1>DevOps Skills Activity</h1>
    <p class="sub">Two timed tasks: reorder the SDLC stages, then answer 10 Git questions. Enter your details to begin — the clock starts the moment each activity opens.</p>
    <label for="inName">Student Name</label>
    <input type="text" id="inName" placeholder="e.g. Ananya Rao" autocomplete="off">
    <label for="inUsn">USN</label>
    <input type="text" id="inUsn" placeholder="e.g. 4VV22CS001" autocomplete="off">
    <div class="err" id="loginErr"></div>
    <button class="btn btn-primary btn-block" onclick="startActivity()">Start Activity 1</button>
  `);
}
function startActivity(){
  const name=document.getElementById('inName').value.trim();
  const usn=document.getElementById('inUsn').value.trim();
  if(!name||!usn){document.getElementById('loginErr').textContent='Enter both name and USN to continue.';return;}
  S.name=name; S.usn=usn; S.order=shuffledStages();
  S.screen='act1'; renderAct1(); startTimer1();
}

function renderAct1(){
  document.getElementById('app').innerHTML = winShell('activity-1 — sdlc-reorder.sh', `
    ${steps('act1')}
    <h1>Activity 1 — Arrange the SDLC Stages</h1>
    <p class="sub">Use the arrows to put the six stages into the correct Software Development Life Cycle order. Submits automatically when time runs out.</p>
    <div class="timer-wrap"><span class="timer-label">Time remaining</span><span class="timer" id="timer1">0:20</span></div>
    <ul id="stageList"></ul>
    <button class="btn btn-primary btn-block" onclick="submitAct1(false)">Submit &amp; Continue</button>
  `);
  renderStageList();
}
function renderStageList(){
  const el=document.getElementById('stageList'); if(!el) return;
  el.innerHTML = S.order.map((k,i)=>`
    <li>
      <span class="pos">${i+1}</span>
      <span class="stagename">${SDLC_LABELS[k]}</span>
      <span class="ud">
        <button ${i===0?'disabled':''} onclick="moveStage(${i},-1)" aria-label="Move up">↑</button>
        <button ${i===S.order.length-1?'disabled':''} onclick="moveStage(${i},1)" aria-label="Move down">↓</button>
      </span>
    </li>`).join('');
}
function moveStage(i,dir){
  const j=i+dir; if(j<0||j>=S.order.length) return;
  [S.order[i],S.order[j]]=[S.order[j],S.order[i]];
  renderStageList();
}
function startTimer1(){
  t1Remain=20; updateTimer1();
  t1Timer=setInterval(()=>{ t1Remain--; updateTimer1(); if(t1Remain<=0){ clearInterval(t1Timer); submitAct1(true);} },1000);
}
function updateTimer1(){
  const el=document.getElementById('timer1'); if(!el) return;
  el.textContent='0:'+String(Math.max(t1Remain,0)).padStart(2,'0');
  el.className='timer'+(t1Remain<=5?' crit':t1Remain<=10?' warn':'');
}
function submitAct1(auto){
  if(S.score1!==null) return;
  clearInterval(t1Timer);
  const matches=S.order.filter((k,i)=>k===SDLC_CORRECT[i]).length;
  S.score1=Math.round((matches/6)*100)/10;
  S.screen='act2'; renderAct2(); startTimer2();
  if(auto) showToast("Time's up — Activity 1 submitted");
}

function renderAct2(){
  document.getElementById('app').innerHTML = winShell('activity-2 — git-quiz.sh', `
    ${steps('act2')}
    <h1>Activity 2 — Git Commands</h1>
    <p class="sub">10 questions, one mark each. Submits automatically when the timer ends.</p>
    <div class="timer-wrap"><span class="timer-label">Time remaining</span><span class="timer" id="timer2">5:00</span></div>
    <div id="qlist">${GIT_Q.map((item,idx)=>`
      <div class="qcard">
        <p class="qtext"><span class="n">Q${idx+1}.</span>${esc(item.q)}</p>
        ${item.o.map((opt,oi)=>`
          <label class="opt"><input type="radio" name="q${idx}" value="${oi}" onchange="selectAns(${idx},${oi})"> ${esc(opt)}</label>
        `).join('')}
      </div>`).join('')}</div>
    <p class="note">Unanswered questions are marked incorrect.</p>
    <button class="btn btn-primary btn-block" onclick="submitAct2(false)">Submit Activity 2</button>
  `);
}
function selectAns(idx,oi){ S.ans[idx]=oi; }
function startTimer2(){
  t2Remain=300; updateTimer2();
  t2Timer=setInterval(()=>{ t2Remain--; updateTimer2(); if(t2Remain<=0){ clearInterval(t2Timer); submitAct2(true);} },1000);
}
function updateTimer2(){
  const el=document.getElementById('timer2'); if(!el) return;
  const m=Math.floor(Math.max(t2Remain,0)/60), s=Math.max(t2Remain,0)%60;
  el.textContent=m+':'+String(s).padStart(2,'0');
  el.className='timer'+(t2Remain<=30?' crit':t2Remain<=60?' warn':'');
}
function submitAct2(auto){
  if(S.score2!==null) return;
  clearInterval(t2Timer);
  let correct=0;
  GIT_Q.forEach((item,idx)=>{ if(S.ans[idx]===item.c) correct++; });
  S.score2=correct;
  S.subDate=new Date();
  S.screen='result'; renderResult();
  if(auto) showToast("Time's up — Activity 2 submitted");
}

function renderResult(){
  const total=S.score1+S.score2;
  document.getElementById('app').innerHTML = winShell('activity — result.log', `
    ${steps('result')}
    <h1>Activity Complete</h1>
    <p class="meta">Student: <b>${esc(S.name)}</b> &nbsp;·&nbsp; USN: <b>${esc(S.usn)}</b></p>
    <p class="meta">Submitted: <b>${fmtDate(S.subDate)}</b></p>
    <div class="scoreboard">
      <div class="scorebox"><div class="big">${S.score1}/10</div><div class="lab">SDLC Reorder</div></div>
      <div class="scorebox"><div class="big">${S.score2}/10</div><div class="lab">Git MCQ</div></div>
      <div class="scorebox total"><div class="big">${total}/20</div><div class="lab">Total</div></div>
    </div>
    <button class="btn btn-primary btn-block" onclick="downloadReport()">Download PDF Report</button>
  `);
}
function showToast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),3200);
}

async function downloadReport(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 20;
  const line=(text,opts={})=>{
    if(y>280){ doc.addPage(); y=20; }
    doc.setFont('helvetica', opts.bold?'bold':'normal');
    doc.setFontSize(opts.size||11);
    doc.setTextColor(opts.color||20);
    const w = doc.splitTextToSize(text,180);
    doc.text(w,14,y); y += (opts.gap||7)*w.length;
  };
  line('DevOps Skills Activity — Report',{bold:true,size:17,gap:9});
  line(`Student Name: ${S.name}`); line(`USN: ${S.usn}`); line(`Submission Date: ${fmtDate(S.subDate)}`);
  y+=2; doc.setDrawColor(200); doc.line(14,y,196,y); y+=10;

  line('Activity 1 — SDLC Stage Rearrangement',{bold:true,size:13,gap:8});
  line(`Your order: ${S.order.map(k=>SDLC_LABELS[k]).join(' -> ')}`);
  line(`Correct order: ${SDLC_CORRECT.map(k=>SDLC_LABELS[k]).join(' -> ')}`);
  line(`Marks: ${S.score1} / 10`,{bold:true});
  y+=4;

  line('Activity 2 — Git Commands MCQ',{bold:true,size:13,gap:8});
  line(`Marks: ${S.score2} / 10`,{bold:true});
  y+=2;
  GIT_Q.forEach((item,idx)=>{
    const chosen = S.ans[idx];
    const ok = chosen===item.c;
    const chosenText = chosen!==undefined ? item.o[chosen] : 'Not answered';
    let t = `Q${idx+1}: ${ok?'Correct':'Incorrect'} — chosen: "${chosenText}"`;
    if(!ok) t += ` | correct: "${item.o[item.c]}"`;
    line(t,{size:9.5,gap:5.5});
  });

  y+=4; doc.setDrawColor(200); doc.line(14,y,196,y); y+=10;
  line(`Total Marks: ${S.score1+S.score2} / 20`,{bold:true,size:14});

  const blob = doc.output('blob');
  const filename = `DevOps-Activity_${(S.usn||'report').replace(/\s+/g,'')}.pdf`;

  let downloads=null;
  try{ if(window.claude && window.claude.use) downloads = await window.claude.use('downloads'); }catch(e){}
  if(downloads){
    try{ await downloads.save({filename, data:blob}); return; }catch(e){}
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

renderLogin();
</script>
</body>
</html>
